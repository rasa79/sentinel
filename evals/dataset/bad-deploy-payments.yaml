id: bad-deploy-payments
chaos: bad_deploy
alert:
  alertname: bad-deploy-payments
  service: payments
  severity: critical
known_cause:
  category: bad_deploy
  affected_service: payments
expected_action: rollback_deploy
tools:
  logs:
  - service: payments
    message: 503 during /work after deploy
    level: ERROR
  metrics:
  - metric: http_errors_total
    value: 0.025
    breach: true
    expression: rate(http_errors_total{service="payments"}[5m])
  deploys:
  - service: payments
    version: 1.0.3
    event: bad_deploy
  - service: payments
    version: 1.0.2
    event: deploy
  runbooks:
  - title: 'bad-deploy-rollback: Diagnostic steps'
    snippet: Roll back the bad release.
    score: 0.9
