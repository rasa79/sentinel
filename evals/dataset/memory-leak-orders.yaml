id: memory-leak-orders
chaos: memory_leak
alert:
  alertname: memory-leak-orders
  service: orders
  severity: critical
known_cause:
  category: memory_leak
  affected_service: orders
expected_action: restart_service
tools:
  logs:
  - service: orders
    message: 'OOM risk: resident memory climbing'
    level: WARN
  metrics:
  - metric: process_resident_memory_bytes
    value: 220000000
    breach: true
    expression: process_resident_memory_bytes{instance=~"orders:.*"}
  deploys: []
  runbooks:
  - title: 'memory-leak: Diagnostic steps'
    snippet: RSS climbing; restart to reclaim.
    score: 0.9
