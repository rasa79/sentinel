id: latency-spike-orders
chaos: latency_spike
alert:
  alertname: latency-spike-orders
  service: orders
  severity: critical
known_cause:
  category: latency_spike
  affected_service: orders
expected_action: restart_service
tools:
  logs:
  - service: orders
    message: slow /work request
    level: WARN
  metrics:
  - metric: http_request_duration_seconds
    value: 0.98
    breach: true
    expression: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service="orders"}[5m]))
  deploys: []
  runbooks:
  - title: 'latency-spike: Diagnostic steps'
    snippet: Check p95 latency trend.
    score: 0.9
