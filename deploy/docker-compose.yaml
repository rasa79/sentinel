# Sentinel demo stack — Phase 0 skeleton.
# Infra services (postgres/prometheus/loki) start in Phase 0; toy-service builds and their config
# wiring arrive in Phase 1 (Task 1.3 mounts prometheus.yml / loki-config.yaml). sentinel-api is a
# placeholder gated behind the "api" profile — its Dockerfile/build is created in Phase 5, so
# Phase 0 only ever brings up the three infra services.
#
# NOTE (D4): Ollama runs on the host. Any service that needs to reach it uses the magic DNS name
#   host.docker.internal, mapped via extra_hosts "host-gateway" (see LEARN[06]).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki:ro

  orders:
    build:
      context: ../demo_stack
    command: ["python", "-m", "services.orders"]
    environment:
      SERVICE_NAME: orders
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LOKI_URL: http://loki:3100
      SENTINEL_SERVICE_VERSION: 1.0.0
    ports:
      - "9001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build:
      context: ../demo_stack
    command: ["python", "-m", "services.payments"]
    environment:
      SERVICE_NAME: payments
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LOKI_URL: http://loki:3100
      SENTINEL_SERVICE_VERSION: 1.0.0
    ports:
      - "9002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    build:
      context: ../demo_stack
    command: ["python", "-m", "services.inventory"]
    environment:
      SERVICE_NAME: inventory
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LOKI_URL: http://loki:3100
      SENTINEL_SERVICE_VERSION: 1.0.0
    ports:
      - "9003:8000"
    depends_on:
      postgres:
        condition: service_healthy

  sentinel-api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: Dockerfile
    # Inject the repo-root .env (gitignored) so the container gets the LLM API key and any
    # provider overrides. Compose's own `.env` auto-loading is for VAR SUBSTITUTION only — it does
    # NOT ship vars into the container, so without `env_file:` the API would build a keyless
    # OpenAI client and crash ("Missing credentials"). The file is gitignored, so no secret enters
    # the repo. `environment:` below still overrides env_file for the container-specific URLs.
    env_file: ../.env
    environment:
      # Container vs host URL resolution (D4): the demo/CLI runs on the HOST and uses
      # localhost/900x for the infra + `localhost:8000` for the API; the CONTAINER reaches those
      # same services by their compose service names. So the API container MUST be given the
      # container-appropriate URLs here (these override any localhost defaults):
      SENTINEL_DATABASE__URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_LOKI__URL: http://loki:3100
      SENTINEL_PROMETHEUS__URL: http://prometheus:9090
      # LLM: a public OpenAI-compatible endpoint (DeepSeek) works identically from host and
      # container, so it is the safe default. For a LOCAL Ollama model instead, override the
      # provider AND the base_url to reach the host-side server: the base_url inside the container
      # must be `http://host.docker.internal:11434/v1` (see the extra_hosts below, D4), while the
      # host CLI uses `http://localhost:11434/v1`. The API key name is a reference — the real key
      # comes from `env_file: ../.env` (DEEPSEEK_API_KEY). Never hardcode a secret here.
      # This host-vs-container URL split is the D4 class of issue — see LEARN[06] for the
      # host.docker.internal/first-party reasoning.
      SENTINEL_LLM__PROVIDER: openai
      SENTINEL_LLM__MODEL: deepseek-v4-flash
      SENTINEL_LLM__BASE_URL: https://api.deepseek.com
      SENTINEL_LLM__API_KEY_ENV: DEEPSEEK_API_KEY
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side Ollama (D4)
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
