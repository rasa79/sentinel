# Sentinel demo stack — Phase 0 skeleton.
# Infra services (postgres/prometheus/loki) start in Phase 0; toy-service builds and their config
# wiring arrive in Phase 1 (Task 1.3 mounts prometheus.yml / loki-config.yaml). sentinel-api is a
# placeholder gated behind the "api" profile — its Dockerfile/build is created in Phase 5, so
# Phase 0 only ever brings up the three infra services.
#
# NOTE (D4): Ollama runs on the host. Any service that needs to reach it uses the magic DNS name
#   host.docker.internal, mapped via extra_hosts "host-gateway" (see LEARN[06]).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    # Config (scrape targets for the toy services) is mounted in Task 1.3.

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    # Custom loki-config.yaml is mounted in Task 1.3; the image default config is used here.

  orders:
    build:
      context: ../demo_stack
    command: ["python", "-m", "services.orders"]
    environment:
      SERVICE_NAME: orders
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LOKI_URL: http://loki:3100
      SENTINEL_SERVICE_VERSION: 1.0.0
    ports:
      - "9001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build:
      context: ../demo_stack
    command: ["python", "-m", "services.payments"]
    environment:
      SERVICE_NAME: payments
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LOKI_URL: http://loki:3100
      SENTINEL_SERVICE_VERSION: 1.0.0
    ports:
      - "9002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    build:
      context: ../demo_stack
    command: ["python", "-m", "services.inventory"]
    environment:
      SERVICE_NAME: inventory
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LOKI_URL: http://loki:3100
      SENTINEL_SERVICE_VERSION: 1.0.0
    ports:
      - "9003:8000"
    depends_on:
      postgres:
        condition: service_healthy

  sentinel-api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SENTINEL_DATABASE__URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_LOKI__URL: http://loki:3100
      SENTINEL_PROMETHEUS__URL: http://prometheus:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side Ollama (D4)
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
