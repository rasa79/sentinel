# Loki single-binary configuration (Task 1.3).
# Toy services push structured JSON log lines to the push API over the compose network
# (`POST /loki/api/v1/push`); no Promtail and no Docker logging plugin are used (see LEARN[10]).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
