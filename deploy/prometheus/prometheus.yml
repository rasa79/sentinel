# Prometheus scrape configuration for the Sentinel demo stack (D16: 5s scrape interval).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sentinel-demo
    metrics_path: /metrics
    static_configs:
      - targets:
          - "orders:8000"
          - "payments:8000"
          - "inventory:8000"
