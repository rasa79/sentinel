# Sentinel base configuration (D14).
# Defaults live here; env vars prefixed with SENTINEL_ (and LLM_PROVIDER) override them.
# The typed accessor is src/sentinel/config.py (Task 0.3).
llm:
  provider: ollama                # ollama | openai
  model: phi4-mini                # local model on this machine (env note: plan named qwen2.5:7b-instruct)
  base_url: http://localhost:11434/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0

embeddings:
  model_name: all-MiniLM-L6-v2    # 384-dim, fixed by D2

database:
  url: postgresql://sentinel:sentinel@localhost:5432/sentinel

loki:
  url: http://localhost:3100

prometheus:
  url: http://localhost:9090

remediation:
  allowed_actions: [restart_service, rollback_deploy, scale_replicas, no_action]
  allowed_services: [orders, payments, inventory]
  dry_run: true                   # D11: safe by default
  confidence_threshold: 0.7

verification:
  delay_seconds: 30
  attempts: 3
